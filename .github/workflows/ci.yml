name: CI

on:
  push:
  pull_request:

jobs:
  mobile-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify generated API types
        run: npm run api:types:check

      - name: Run quality checks
        run: npm run check

  backend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Verify environment
        run: python -m pip check

      - name: Lint
        run: ruff check app tests migrations scripts

      - name: Check formatting
        run: ruff format --check app tests migrations scripts

      - name: Run tests
        run: pytest --cov=app --cov-fail-under=70

      - name: Render migration SQL
        run: alembic upgrade head --sql

      - name: Verify committed OpenAPI schema
        run: |
          python scripts/export_openapi.py openapi.generated.json
          diff -u openapi.json openapi.generated.json

  backend-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build --tag nutripilot-api:ci backend

      - name: Verify non-root runtime
        run: test "$(docker run --rm --entrypoint id nutripilot-api:ci -u)" != "0"

  release-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build same-origin release image
        run: docker build --file Dockerfile.production --tag nutripilot-release:ci .

      - name: Verify release contents and identity
        run: |
          test "$(docker run --rm --entrypoint id nutripilot-release:ci -u)" != "0"
          docker run --rm --entrypoint sh nutripilot-release:ci -c \
            "test -f /app/web/index.html && test -f /app/alembic.ini"
