name: CI

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run api:types:check
      - run: npm run check

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nutripilot_test
          POSTGRES_PASSWORD: nutripilot_test
          POSTGRES_DB: nutripilot_u4_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nutripilot_test -d nutripilot_u4_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NUTRIPILOT_DATABASE_URL: postgresql+psycopg://nutripilot_test:nutripilot_test@127.0.0.1:5432/nutripilot_u4_test
      NUTRIPILOT_TEST_DATABASE_URL: postgresql+psycopg://nutripilot_test:nutripilot_test@127.0.0.1:5432/nutripilot_u4_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - run: ruff check app tests migrations scripts
      - run: ruff format --check app tests migrations scripts
      - run: |
          alembic upgrade head
          python -m pytest --cov=app --cov-fail-under=70
      - run: |
          python scripts/export_openapi.py openapi.generated.json
          diff -u openapi.json openapi.generated.json
